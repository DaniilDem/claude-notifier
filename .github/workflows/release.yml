name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: swift test
      - run: swift build -c release
      - name: Package
        run: |
          cp .build/release/alerter claude-notifier
          shasum -a 256 claude-notifier > claude-notifier.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" claude-notifier claude-notifier.sha256 --generate-notes
